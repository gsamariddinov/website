<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Random Product</title>
<style>
:root{--paper:#f6f3e4;--grid:rgba(0,0,0,.06);--card:#fffdf6;--ink:#14163a;--pink:#f06fa8;--pink-d:#d9488a;--yel:#f7d774;--yel-d:#e2bd55;--line:#3b3b3b;--muted:#555;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1c1a2e;--grid:rgba(255,255,255,.06);--card:#2a2745;--ink:#fff7d6;--line:#fff7d6;--muted:#bbb}}
:root[data-theme="dark"]{--paper:#1c1a2e;--grid:rgba(255,255,255,.06);--card:#2a2745;--ink:#fff7d6;--line:#fff7d6;--muted:#bbb}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);background-color:var(--paper);
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;
display:flex;align-items:center;justify-content:center;padding:16px}
.wrap{width:100%;max-width:980px;text-align:center}
.cards{display:flex;gap:clamp(14px,3vw,32px);justify-content:center}
.card{position:relative;flex:1;min-width:0;background:var(--card);border:6px solid var(--pink);border-radius:26px;box-shadow:0 14px 0 var(--pink-d);
min-height:clamp(190px,34vh,300px);display:flex;align-items:center;justify-content:center;padding:44px 14px 18px;overflow:hidden}
.dots{position:absolute;top:14px;left:18px;display:flex;gap:8px}
.dots i{width:14px;height:14px;border-radius:50%;display:block}
.dots i:nth-child(1){background:#f7c92b}.dots i:nth-child(2){background:#f06fa8}.dots i:nth-child(3){background:#19b394}
.txt{font-size:clamp(1.7rem,6.2vw,4rem);font-weight:900;line-height:1.1;word-break:break-word;color:var(--ink);letter-spacing:.5px}
.pic{font-size:clamp(4rem,17vw,9rem);line-height:1}
.pic svg{width:clamp(120px,26vw,240px);height:auto;filter:drop-shadow(0 8px 6px rgba(0,0,0,.28))}
.hint{opacity:.45;font-size:clamp(1.3rem,4vw,2.2rem)}
.lbl{position:absolute;top:12px;right:18px;font-size:.75rem;font-weight:800;letter-spacing:2px;color:var(--muted)}
.scan{position:absolute;left:0;right:0;top:-10%;height:6px;background:linear-gradient(90deg,transparent,#f06fa8,#f7d774,#3ba7ff,transparent);opacity:0;pointer-events:none}
.scanning .scan{opacity:1;animation:sweep .7s linear infinite}
.scanning .txt,.scanning .pic{animation:glitch .18s steps(2) infinite}
@keyframes sweep{to{top:110%}}
@keyframes glitch{0%{transform:translateX(-3px)}100%{transform:translateX(3px)}}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.3) rotate(-8deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
button{margin-top:40px;font:inherit;font-size:clamp(1.1rem,4vw,1.7rem);font-weight:900;letter-spacing:2px;color:var(--line);background:var(--yel);border:4px solid var(--line);border-radius:999px;padding:16px 56px;cursor:pointer;box-shadow:0 9px 0 var(--yel-d);transition:transform .08s,box-shadow .08s}
button:hover{transform:translateY(-2px)}
button:active{transform:translateY(7px);box-shadow:0 2px 0 var(--yel-d)}
button:disabled{cursor:wait}
button:focus-visible{outline:4px solid var(--pink);outline-offset:4px}
.status{margin-top:26px;font-size:.72rem;font-weight:800;letter-spacing:1.5px;color:var(--muted);display:flex;gap:28px;justify-content:center}
.status b{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9ccc3c;margin-right:6px}
.m2{margin-top:34px}
.mcard{min-height:0;padding:44px 18px 22px;flex-direction:column;gap:8px}
.mname{font-size:clamp(1.4rem,5vw,2.4rem);font-weight:900;color:var(--ink)}
.mdesc{font-size:clamp(1rem,3vw,1.4rem);font-weight:700;color:var(--ink)}
.mtask{font-size:clamp(.85rem,2.6vw,1.1rem);color:var(--muted);font-weight:700}
.brow{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
button.alt{margin-top:26px;background:var(--pink);color:#fff;border-color:var(--pink-d);box-shadow:0 9px 0 var(--pink-d);padding:14px 40px}
button.alt:active{box-shadow:0 2px 0 var(--pink-d)}
#tbtn{margin-top:40px}
.mtask{text-align:left;line-height:1.5;color:var(--ink)!important;font-size:clamp(1rem,3vw,1.3rem)!important}
.bubble{background:#fff3c4;color:#14163a;border:3px solid var(--yel-d);border-radius:18px;padding:10px 14px;font-weight:800;font-size:clamp(1rem,3.2vw,1.4rem)}
.mtime{font-size:clamp(1.6rem,6vw,2.6rem);font-weight:900;color:var(--pink-d)}
html,body{height:auto;min-height:100%}
body{align-items:flex-start;justify-content:center}
.wrap{margin:auto}
.lang{text-align:right;margin-bottom:12px}
button.lg{margin:0 0 0 8px;padding:6px 18px;font-size:.95rem;letter-spacing:1px;border-width:3px;box-shadow:0 4px 0 var(--yel-d);background:var(--card);color:var(--ink);border-color:var(--line)}
button.lg.on{background:var(--pink);color:#fff;border-color:var(--pink-d);box-shadow:0 4px 0 var(--pink-d)}
button.lg:active{transform:translateY(3px);box-shadow:0 1px 0 var(--yel-d)}
@media (max-width:520px){.card{padding:40px 8px 14px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="lang"><button id="lu" type="button" class="lg">UZ</button><button id="le" type="button" class="lg on">ENG</button></div>
  <div class="cards" id="cards">
    <div class="card"><div class="dots"><i></i><i></i><i></i></div><div class="lbl">PRODUCT</div><div class="scan"></div><div class="txt hint" id="name">Press the button!</div></div>
    <div class="card"><div class="dots"><i></i><i></i><i></i></div><div class="lbl">PICTURE</div><div class="scan"></div><div class="pic hint" id="pic">?</div></div>
  </div>
  <div class="brow"><button id="btn" type="button">RANDOM PRODUCT</button></div>
  <div class="m2">

  <div class="brow"><button id="mbtn" type="button" class="alt">PR MODEL</button><button id="cbtn" type="button" class="alt" style="display:none;background:var(--yel);color:var(--line);border-color:var(--line);box-shadow:0 9px 0 var(--yel-d)">CUSTOMER QUESTION</button></div>
</div>
<div class="status"><span><b></b>PRODUCTS: 35</span><span id="st">STATUS: READY</span></div>

const P=Object.keys(IC).map(n=>[n,`<svg viewBox="0 0 100 100" role="img" aria-label="${n}">${IC[n]}</svg>`]);

const COL=["#e63946","#f77f00","#2a9d8f","#3a86ff","#8338ec","#ff006e","#2b9348"];
let deck=[],last=null,ci=0,busy=false;
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function refill(){deck=shuffle(P.slice());if(last&&deck[deck.length-1][0]===last&&deck.length>1){const n=deck.length-1;[deck[0],deck[n]]=[deck[n],deck[0]];}}
function show(p,final){
  const n=$("name"),i=$("pic");
  n.textContent=p[0];i.innerHTML=p[1];
  n.classList.remove("hint","pop");i.classList.remove("hint","pop");
  if(final){void n.offsetWidth;n.classList.add("pop");i.classList.add("pop");}
}
function go(){
  if(busy)return;busy=true;
  if(!deck.length)refill();
  const chosen=deck.pop();last=chosen[0];ci++;
  const btn=$("btn");btn.disabled=true;btn.textContent="SCANNING";$("st").textContent="STATUS: SCANNING";
  $("cards").classList.add("scanning");
  const t=setInterval(()=>show(P[Math.floor(Math.random()*P.length)],false),90);
  setTimeout(()=>{
    clearInterval(t);
    $("cards").classList.remove("scanning");
    show(chosen,true);
    btn.disabled=false;btn.textContent="RANDOM PRODUCT";$("st").textContent="STATUS: READY";busy=false;
  },1100);
}
const L={en:{task:"Task:",cq:"CUSTOMER QUESTION",cust:"Customer:",up:"TIME'S UP!",first:"Press RANDOM PRODUCT first!"},uz:{task:"Vazifa:",cq:"MIJOZ SAVOLI",cust:"Mijoz:",up:"VAQT TUGADI!",first:"Avval RANDOM PRODUCT ni bosing!"}};
const M=[
["Press Agentry","Write a 2–3 sentence, super loud announcement.","2–3 gaplik eng shovqinli e'lon yozing."],
["Public Information","What is it? How much does it cost? Where can you get it?<br>Facts only.","Nima u? Narxi qancha? Qayerdan olish mumkin?<br>Faqat faktlar."],
["Two-Way Asymmetric","1) Think about what customers like.<br>2) Write an announcement that persuades them.","1) Mijozlar nimani yoqtirishini o'ylang.<br>2) Shunga qarab ishontiradigan e'lon yozing."],
["Two-Way Symmetric","1) Press “CUSTOMER QUESTION” and read the feedback.<br>2) Based on it, change the product in 1 way (price, color, size, packaging).","1) «MIJOZ SAVOLI» ni bosing va fikrni o'qing.<br>2) Shu fikrga qarab mahsulotni 1 ta narsada o'zgartiring (narx, rang, hajm, qadoq)."]
];
const GQ=["Too expensive. I'd buy it if it were cheaper.|Narxi juda qimmat. Arzonroq bo'lsa olardim.","The color is boring. Do you have other colors?|Rangi zerikarli. Boshqa ranglari bormi?","Will it break quickly? I don't trust the quality.|Tez buzilib qolmasmikan? Sifatiga ishonchim yo'q.","It's too big and heavy. Is there a smaller version?|Juda katta va og'ir. Kichikroq variant bormi?","Is there a warranty? What if it breaks?|Kafolat bormi? Buzilsa nima bo'ladi?","Is it bad for the environment? I'd like it better made from recycled materials.|Atrof-muhitga zarar qilmaydimi? Qayta ishlangan materialdan bo'lsa yaxshi edi.","The design looks old-fashioned. Can you make it more modern?|Dizayni eskicha. Zamonaviyroq qilib bo'lmaydimi?","There's too much plastic in the packaging. Please reduce it.|Qadoqda ortiqcha plastik ko'p. Buni kamaytirsangiz bo'lardi.","Delivery is slow. Can it be faster?|Yetkazib berish sekin. Tezroq bo'lishi mumkinmi?","Is it safe for children? What is it made of?|Bolalar uchun xavfsizmi? Tarkibi qanday?"];
let lang="en",mdeck=[],mlast=null,curM=null,curQ=null;const qdecks={},qprev={};
const T=k=>L[lang][k];
const taskHTML=()=>T("task")+"<br>"+curM[lang=="en"?1:2];
const bubbleText=()=>"💬 "+T("cust")+" “"+curQ.split("|")[lang=="en"?0:1]+"”";
function mgo(){
  if(!mdeck.length){mdeck=shuffle(M.slice());if(mlast&&mdeck[mdeck.length-1][0]===mlast){[mdeck[0],mdeck[mdeck.length-1]]=[mdeck[mdeck.length-1],mdeck[0]];}}
  curM=mdeck.pop();mlast=curM[0];curQ=null;
  const e=$("mod");e.classList.remove("hint","pop");
  e.innerHTML=`<div class="mname">${curM[0]}</div><div class="mtask" id="mtk">${taskHTML()}</div><div class="bubble" id="cq" style="display:none"></div><div class="mtime" id="mt">⏱ 2:00</div>`;
  void e.offsetWidth;e.classList.add("pop");
  $("cbtn").style.display=curM[0]=="Two-Way Symmetric"?"":"none";
  count($("mt"),120,true);
}
let qdeck=[],qlast=null;
function qgo(){
  const c=$("cq");c.style.display="block";c.classList.remove("pop");
  if(!qdeck.length){qdeck=shuffle(GQ.slice());if(qdeck[qdeck.length-1]===qlast){[qdeck[0],qdeck[qdeck.length-1]]=[qdeck[qdeck.length-1],qdeck[0]];}}
  curQ=qdeck.pop();qlast=curQ;
  c.textContent=bubbleText();void c.offsetWidth;c.classList.add("pop");
}
function setLang(l){
  lang=l;$("lu").classList.toggle("on",l=="uz");$("le").classList.toggle("on",l=="en");
  $("cbtn").textContent=T("cq");
  if(curM&&$("mtk"))$("mtk").innerHTML=taskHTML();
  const c=$("cq");if(c&&c.style.display=="block")c.textContent=curQ?bubbleText():T("first");
}
const timers=new Map();
function fmt(n){return Math.floor(n/60)+":"+String(n%60).padStart(2,"0");}
function count(el,secs,mm){
  clearInterval(timers.get(el.id));let n=secs;const base=el.textContent;
  const draw=()=>{el.textContent="⏱ "+(mm?fmt(n):n);};draw();
  const t=setInterval(()=>{n--;if(n>0){draw();}else{clearInterval(t);el.textContent="⏰ "+T("up");if(!mm)setTimeout(()=>{el.textContent="⏱ "+secs},3000);}},1000);
  timers.set(el.id,t);
}
$("lu").addEventListener("click",()=>setLang("uz"));
$("le").addEventListener("click",()=>setLang("en"));
$("mbtn").addEventListener("click",mgo);
$("cbtn").addEventListener("click",qgo);
$("btn").addEventListener("click",go);
</script>
